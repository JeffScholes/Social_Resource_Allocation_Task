<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Resource Allocation Task</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- PsychoJS uses this element for its saving, error, and completion dialogs. -->
    <div id="root" aria-live="polite"></div>
    <main id="app" aria-live="polite">
      <section class="start-card">
        <h1>Social Resource Allocation Task</h1>
        <p>Enter your participant ID (if you have one), then start the experiment.</p>
        <label for="participant-id">Participant ID</label>
        <input id="participant-id" type="text" autocomplete="off" maxlength="80">
        <button id="start-experiment" class="primary">Start experiment</button>
        <p class="muted">Use headphones if possible. This button enables the narrated instructions in your browser.</p>
      </section>
    </main>
    <!-- PsychoJS uses CreateJS/PreloadJS for its resource queue. -->
    <script src="preloadjs.min.js"></script>
    <!-- The locally vendored PsychoJS module includes its remaining runtime dependencies. -->
    <script type="module" src="experiment.js"></script>
  </body>
</html>
